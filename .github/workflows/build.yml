name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore my.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias key -storepass android -keypass android \
            -dname "CN=MonstSwitch,O=Dev,C=JP"
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          $BT/zipalign -p 4 app/build/outputs/apk/debug/app-debug.apk aligned.apk
          $BT/apksigner sign --ks my.jks --ks-pass pass:android --key-pass pass:android \
            --out MonstSwitch.apk aligned.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonstSwitch-APK
          path: MonstSwitch.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MonstSwitch Build ${{ github.run_number }}
          files: MonstSwitch.apk
          generate_release_notes: true
